[defaults]
# Only hosts with the matching Terraform project tags will be discovered.
inventory = ./aws_ec2.yml
remote_user = ec2-user
private_key_file = ~/.ssh/olu1.pem
timeout = 45
log_path = ./ansible.log
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 4

[ssh_connection]
pipelining = True